<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexusAudit</title>

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Rajdhani', sans-serif;
  background: #0a0e17;
  color: #e0e0e0;
  overflow-x: hidden;
}

#particles {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

.container {
  position: relative;
  z-index: 1;
  max-width: 1200px;
  margin: 0 auto;
  padding: 2rem;
}

.landing {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.logo {
  width: 100px;
  height: 100px;
  background: linear-gradient(135deg, #00ff88, #00ddff);
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3rem;
  margin-bottom: 2rem;
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-20px); }
}

h1 {
  font-family: 'Share Tech Mono', monospace;
  font-size: clamp(2.5rem, 6vw, 4rem);
  font-weight: 700;
  margin-bottom: 1rem;
  color: #00ddff;
  text-shadow: 0 0 30px rgba(0, 221, 255, 0.5);
}

.tagline {
  font-size: 1.2rem;
  color: #888;
  max-width: 500px;
  margin: 0 auto 3rem;
}

.btn {
  padding: 1rem 2.5rem;
  background: linear-gradient(135deg, #00ff88, #00ddff);
  border: none;
  border-radius: 8px;
  color: #000;
  font-family: 'Share Tech Mono', monospace;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.2s;
}

.btn:hover {
  transform: translateY(-3px);
}

.scanner {
  display: none;
}

.scanner.active {
  display: block;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1.5rem;
  background: rgba(20, 25, 35, 0.8);
  backdrop-filter: blur(10px);
  border-radius: 12px;
  margin-bottom: 2rem;
}

.header-logo {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  font-family: 'Share Tech Mono', monospace;
  font-size: 1.5rem;
  font-weight: 700;
}

.status {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 1rem;
  background: rgba(0, 255, 136, 0.1);
  border: 1px solid rgba(0, 255, 136, 0.3);
  border-radius: 20px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.85rem;
  color: #00ff88;
}

.dot {
  width: 8px;
  height: 8px;
  background: #00ff88;
  border-radius: 50%;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.scan-form {
  background: rgba(20, 25, 35, 0.6);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(0, 221, 255, 0.2);
  border-radius: 12px;
  padding: 2rem;
  margin-bottom: 2rem;
}

.scan-form h2 {
  font-family: 'Share Tech Mono', monospace;
  margin-bottom: 1.5rem;
}

.input-group {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
}

input {
  flex: 1;
  min-width: 250px;
  padding: 1rem;
  background: rgba(10, 14, 23, 0.8);
  border: 1px solid rgba(0, 221, 255, 0.3);
  border-radius: 8px;
  color: #e0e0e0;
  font-family: 'Share Tech Mono', monospace;
}

input:focus {
  outline: none;
  border-color: #00ddff;
}

.terminal {
  display: none;
  background: rgba(10, 14, 23, 0.9);
  border: 1px solid rgba(0, 221, 255, 0.2);
  border-radius: 12px;
  padding: 1.5rem;
  margin-bottom: 2rem;
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.9rem;
}

.terminal.active {
  display: block;
}

.progress {
  height: 6px;
  background: rgba(0, 221, 255, 0.1);
  border-radius: 3px;
  overflow: hidden;
  margin: 1rem 0;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, #00ff88, #00ddff);
  width: 0;
  transition: width 0.3s;
}

.log {
  max-height: 120px;
  overflow-y: auto;
  color: #888;
  line-height: 1.8;
}

.results {
  display: none;
}

.results.active {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 2rem;
}

.metrics {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1rem;
  margin-bottom: 2rem;
}

.metric {
  background: rgba(20, 25, 35, 0.6);
  border-left: 4px solid;
  border-radius: 8px;
  padding: 1.5rem;
}

.metric.critical { border-color: #ff0055; }
.metric.warning { border-color: #ffaa00; }
.metric.info { border-color: #00ddff; }
.metric.success { border-color: #00ff88; }

.metric-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.85rem;
  color: #888;
  margin-bottom: 0.5rem;
}

.metric-value {
  font-size: 2.5rem;
  font-weight: 700;
}

.metric.critical .metric-value { color: #ff0055; }
.metric.warning .metric-value { color: #ffaa00; }
.metric.info .metric-value { color: #00ddff; }
.metric.success .metric-value { color: #00ff88; }

.panel {
  background: rgba(20, 25, 35, 0.6);
  border: 1px solid rgba(0, 221, 255, 0.2);
  border-radius: 12px;
  padding: 1.5rem;
}

.panel h3 {
  font-family: 'Share Tech Mono', monospace;
  margin-bottom: 1rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid rgba(0, 221, 255, 0.2);
}

.vuln {
  background: rgba(10, 14, 23, 0.6);
  border: 1px solid rgba(0, 221, 255, 0.2);
  border-radius: 8px;
  padding: 1rem;
  margin-bottom: 1rem;
  cursor: pointer;
  transition: all 0.2s;
}

.vuln:hover {
  border-color: #00ddff;
  transform: translateX(3px);
}

.vuln-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 1rem;
  margin-bottom: 0.5rem;
}

.vuln-title {
  font-weight: 600;
}

.badge {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.75rem;
  padding: 0.25rem 0.75rem;
  border-radius: 4px;
  white-space: nowrap;
}

.badge.critical { background: rgba(255, 0, 85, 0.2); color: #ff0055; }
.badge.high { background: rgba(255, 85, 0, 0.2); color: #ff5500; }
.badge.medium { background: rgba(255, 170, 0, 0.2); color: #ffaa00; }
.badge.low { background: rgba(0, 221, 255, 0.2); color: #00ddff; }

.vuln-desc {
  font-size: 0.9rem;
  color: #888;
}

.console {
  background: rgba(10, 14, 23, 0.9);
  border: 1px solid rgba(0, 255, 136, 0.2);
  border-radius: 8px;
  padding: 1.5rem;
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.85rem;
  min-height: 400px;
  color: #00ff88;
}

.console-section {
  margin-bottom: 1.5rem;
}

.console-label {
  color: #ffaa00;
  font-weight: 600;
  margin-bottom: 0.5rem;
}

.console-code {
  background: rgba(0, 0, 0, 0.5);
  border-radius: 4px;
  padding: 1rem;
  overflow-x: auto;
  white-space: pre-wrap;
}

@media (max-width: 768px) {
  .results.active {
    grid-template-columns: 1fr;
  }
}
</style>

<canvas id="particles"></canvas>

<div class="container">
  <div class="landing" id="landing">
    <div class="logo">🔒</div>
    <h1>NEXUSAUDIT</h1>
    <p class="tagline">Advanced web security scanner with real-time vulnerability detection</p>
    <button class="btn" onclick="start()">ENTER SCANNER</button>
  </div>

  <div class="scanner" id="scanner">
    <div class="header">
      <div class="header-logo">🔒 NEXUSAUDIT</div>
      <div class="status">
        <div class="dot"></div>
        ONLINE
      </div>
    </div>

    <div class="scan-form">
      <h2>Security Scanner</h2>
      <div class="input-group">
        <input type="text" id="url" placeholder="https://example.com">
        <button class="btn" onclick="scan()">SCAN</button>
      </div>
    </div>

    <div class="terminal" id="terminal">
      <div style="color: #00ddff; margin-bottom: 1rem" id="status">Initializing...</div>
      <div class="progress">
        <div class="progress-bar" id="progress"></div>
      </div>
      <div class="log" id="log"></div>
    </div>

    <div class="metrics" id="metrics"></div>

    <div class="results" id="results">
      <div class="panel">
        <h3>⚠️ Vulnerabilities</h3>
        <div id="vulns"></div>
      </div>

      <div class="panel">
        <h3>🔬 Details</h3>
        <div class="console" id="console">
          <div style="color: #888">Select a vulnerability to view details</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const particles = [];
for (let i = 0; i < 100; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    z: Math.random() * 1000,
    vz: Math.random() * 2 + 1
  });
}

function animate() {
  ctx.fillStyle = 'rgba(10, 14, 23, 0.1)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  particles.forEach(p => {
    p.z -= p.vz;
    if (p.z <= 0) {
      p.z = 1000;
      p.x = Math.random() * canvas.width;
      p.y = Math.random() * canvas.height;
    }

    const scale = 1000 / p.z;
    const x = (p.x - canvas.width / 2) * scale + canvas.width / 2;
    const y = (p.y - canvas.height / 2) * scale + canvas.height / 2;
    const size = scale * 2;
    const alpha = 1 - p.z / 1000;

    ctx.fillStyle = `rgba(0, 221, 255, ${alpha})`;
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fill();
  });

  requestAnimationFrame(animate);
}

animate();

window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

function start() {
  document.getElementById('landing').style.display = 'none';
  document.getElementById('scanner').classList.add('active');
}

let vulns = [];

async function scan() {
  const input = document.getElementById('url').value.trim();
  if (!input) return alert('Enter a URL');

  let url = input;
  if (!url.match(/^https?:\/\//)) url = 'https://' + url;

  document.getElementById('results').classList.remove('active');
  document.getElementById('terminal').classList.add('active');

  const progress = document.getElementById('progress');
  const status = document.getElementById('status');
  const log = document.getElementById('log');

  progress.style.width = '0%';
  log.innerHTML = `<div style="color: #00ff88">[+] Target: ${url}</div>`;

  const phases = [
    { p: 20, msg: 'DNS lookup...', d: 400 },
    { p: 40, msg: 'SSL check...', d: 600 },
    { p: 60, msg: 'Header scan...', d: 700 },
    { p: 80, msg: 'Vuln test...', d: 500 },
    { p: 100, msg: 'Done', d: 300 }
  ];

  for (const phase of phases) {
    await new Promise(r => setTimeout(r, phase.d));
    progress.style.width = phase.p + '%';
    status.textContent = phase.msg;
    log.innerHTML += `<div>[>] ${phase.msg}</div>`;
  }

  await analyze(url);
}

async function analyze(url) {
  vulns = [];
  let crit = 0, high = 0, med = 0, low = 0;

  const domain = new URL(url).hostname;
  const https = url.startsWith('https://');

  if (!https) {
    vulns.push({
      id: 1,
      title: 'No HTTPS',
      severity: 'critical',
      desc: 'Site uses unencrypted HTTP',
      impact: 'Traffic interception, credential theft',
      fix: 'Enable HTTPS with SSL certificate'
    });
    crit++;
  }

  vulns.push({
    id: 2,
    title: 'Missing CSP',
    severity: 'high',
    desc: 'No Content Security Policy header',
    impact: 'XSS attacks possible',
    fix: 'Add CSP header'
  });
  high++;

  vulns.push({
    id: 3,
    title: 'Missing HSTS',
    severity: 'medium',
    desc: 'No Strict-Transport-Security',
    impact: 'SSL stripping attacks',
    fix: 'Add HSTS header'
  });
  med++;

  vulns.push({
    id: 4,
    title: 'No X-Frame-Options',
    severity: 'medium',
    desc: 'Clickjacking possible',
    impact: 'UI redressing attacks',
    fix: 'Add X-Frame-Options header'
  });
  med++;

  if (domain.startsWith('www.')) {
    vulns.push({
      id: 5,
      title: 'Subdomain Risk',
      severity: 'low',
      desc: 'Potential subdomain takeover',
      impact: 'Phishing attacks',
      fix: 'Audit DNS records'
    });
    low++;
  }

  const score = Math.max(0, 100 - (crit * 25 + high * 15 + med * 8 + low * 3));

  show(url, {crit, high, med, low, score});
}

function show(url, stats) {
  setTimeout(() => {
    document.getElementById('terminal').classList.remove('active');
    document.getElementById('results').classList.add('active');

    document.getElementById('metrics').innerHTML = `
      <div class="metric critical">
        <div class="metric-label">CRITICAL</div>
        <div class="metric-value">${stats.crit}</div>
      </div>
      <div class="metric warning">
        <div class="metric-label">HIGH/MED</div>
        <div class="metric-value">${stats.high + stats.med}</div>
      </div>
      <div class="metric info">
        <div class="metric-label">LOW</div>
        <div class="metric-value">${stats.low}</div>
      </div>
      <div class="metric ${stats.score >= 70 ? 'success' : 'warning'}">
        <div class="metric-label">SCORE</div>
        <div class="metric-value">${stats.score}</div>
      </div>
    `;

    const list = document.getElementById('vulns');
    list.innerHTML = '';

    vulns.forEach(v => {
      const div = document.createElement('div');
      div.className = 'vuln';
      div.innerHTML = `
        <div class="vuln-header">
          <div class="vuln-title">${v.title}</div>
          <div class="badge ${v.severity}">${v.severity.toUpperCase()}</div>
        </div>
        <div class="vuln-desc">${v.desc}</div>
      `;
      div.onclick = () => showDetails(v);
      list.appendChild(div);
    });

    if (vulns.length) showDetails(vulns[0]);
  }, 300);
}

function showDetails(v) {
  document.getElementById('console').innerHTML = `
    <div style="color: #00ddff; font-weight: 600; margin-bottom: 1rem">[+] ${v.title}</div>
    <div class="console-section">
      <div class="console-label">SEVERITY</div>
      <div>${v.severity.toUpperCase()}</div>
    </div>
    <div class="console-section">
      <div class="console-label">IMPACT</div>
      <div style="color: #888">${v.impact}</div>
    </div>
    <div class="console-section">
      <div class="console-label">🛡️ FIX</div>
      <div style="color: #888">${v.fix}</div>
    </div>
  `;
}

document.getElementById('url').addEventListener('keypress', e => {
  if (e.key === 'Enter') scan();
});
</script>
</body>
</html>
